[project]
name = "backend"
version = "0.1.0"
description = "Smart Housing Decision Support System Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pgvector>=0.3.6",
    "psycopg2-binary>=2.9.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "sentence-transformers>=2.3.0",
    "sqlalchemy>=2.0.0",
    "torch>=2.0.0",
    "uvicorn[standard]>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
