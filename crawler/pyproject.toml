[project]
name = "crawler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.0.0",
    "lightgbm>=4.7.0",
    "optuna>=5.0.0",
    "pandas>=2.0.0",
    "pgvector>=0.3.0",
    "psycopg2-binary>=2.9.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "requests>=2.31.0",
    "sentence-transformers>=3.0.0",
    "sqlalchemy>=2.0.0",
    "tiktoken>=0.7.0",
    "torch>=2.0.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
crawler = "."
